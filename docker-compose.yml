services:
  # STT 의 창구(:8100 WebSocket). 게이트웨이가 host.docker.internal:8100 으로 붙는다.
  # **전사 엔진은 아래 nemo 서비스다** — 이 컨테이너는 발화 경계(VAD·무음 확정)와 필터만 맡고
  # 발화 WAV 를 nemo 로 보낸다(asr_backends.NemotronASR). whisper 모델은 기본으로 올리지 않는다.
  whisper:
    build: .
    container_name: npc_whisper
    restart: unless-stopped
    ports:
      - "${WHISPER_PORT:-8100}:8100"
    environment:
      WHISPER_HOST: 0.0.0.0
      WHISPER_PORT: 8100
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v2}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANG: ${WHISPER_LANG:-ko}
      WHISPER_LOG_LEVEL: ${WHISPER_LOG_LEVEL:-INFO}
      WHISPER_SILENCE_FLUSH_SEC: ${WHISPER_SILENCE_FLUSH_SEC:-1.5}
      WHISPER_MAX_BUFFER_SEC: ${WHISPER_MAX_BUFFER_SEC:-10.0}
      WHISPER_MIN_CHARS: ${WHISPER_MIN_CHARS:-1}
      # segment = 발화 단위로 한 번에 전사(기본). stream = 기존 LocalAgreement 스트리밍(롤백용, faster-whisper 전용)
      WHISPER_MODE: ${WHISPER_MODE:-segment}
      WHISPER_MAX_UTTERANCE_SEC: ${WHISPER_MAX_UTTERANCE_SEC:-20.0}
      WHISPER_MIN_UTTERANCE_SEC: ${WHISPER_MIN_UTTERANCE_SEC:-0.4}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      # 빠른 발화 확정(npc_panopticon/docs/early_endpoint_plan.md). 켜는 순서 = 판옵티콘 P2 → SIGNALS → EARLY.
      # SIGNALS=1 이면 확정 앞뒤로 speech_start/speech_end 를 보낸다. EARLY 는 비우면 SILENCE_FLUSH 그대로
      WHISPER_SPEECH_SIGNALS: ${WHISPER_SPEECH_SIGNALS:-0}
      WHISPER_EARLY_FLUSH_SEC: ${WHISPER_EARLY_FLUSH_SEC:-}
      WHISPER_PAUSE_LOG_MIN_SEC: ${WHISPER_PAUSE_LOG_MIN_SEC:-0.2}
      # 백엔드. nemotron(기본 — 2026-10-02 하루 운용 뒤 채택, 10-07 정착) | faster-whisper(폴백, WHISPER_MODEL 을 이 프로세스에 올린다)
      # 폴백으로 되돌리기: .env 에 WHISPER_BACKEND=faster-whisper 를 두고
      #   docker compose up -d --no-deps whisper && docker compose stop nemo   (안 내리면 GPU 에 모델이 둘)
      WHISPER_BACKEND: ${WHISPER_BACKEND:-nemotron}
      # nemotron 전용. compose 망 안의 nemo 서비스 주소와 언어 로캘(비우면 WHISPER_LANG 에서 변환)
      NEMO_URL: ${NEMO_URL:-http://nemo:18101}
      NEMO_LANGUAGE: ${NEMO_LANGUAGE:-}
      # nemo 의 /ready 를 기다리는 상한(초). 0 = 무한정 — 끝내 안 오면 exit 1 로 재시작을 되풀이하는 대신
      # 「Up (unhealthy)」로 서서 기다린다(아래 healthcheck 가 8100 이 열렸는지로 판정).
      # 2026-10-04~06 에 nemo 가 죽어 있는 동안 180초 상한이 61시간에 1211회 재시작을 만들었다.
      NEMO_READY_TIMEOUT_SEC: ${NEMO_READY_TIMEOUT_SEC:-0}
    volumes:
      - whisper_model_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # compose 가 띄울 때는 nemo 가 /ready 가 된 뒤에 시작한다. 엔진이 재부팅 뒤 되살릴 때는 이 순서가
    # 보장되지 않으므로 NemotronASR 의 대기가 두 번째 겹이다.
    depends_on:
      nemo:
        condition: service_healthy
    # ws_server 는 ASR 준비(nemo /ready 확인) **뒤에** 8100 을 연다 — /health 가 200 이면 전사 가능 상태다.
    # (맨 TCP 접속으로 재면 websockets 가 매번 트레이스백을 남긴다 — ws_server._process_request 참고)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Nemotron ASR 서버(NVIDIA NeMo-Speech.cpp v0.1.0, HTTP /v1/audio/transcriptions = offline 모드).
  # 런타임·GGUF 는 **이미지에 굽는다**(nemo/Dockerfile) — bind mount 는 재부팅 레이스로 exit 127 이 나고
  # restart 정책이 손을 못 댄다(2026-10-04 실측, syrinx·go2rtc 전례). 그래서 볼륨이 없다.
  # 3070 8GB 에는 모델 하나만 올리므로 whisper 쪽은 nemotron 백엔드일 때 whisper 모델을 로드하지 않는다.
  nemo:
    build: ./nemo
    image: npc_nemo:0.1.0-nemotron3.5-q8
    container_name: npc_nemo
    restart: unless-stopped
    command:
      - serve
      - --asr.model.path
      - /models/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf
      - --device
      - cuda:0
      - --host
      - 0.0.0.0
      - --port
      - "18101"
      - --no-ui
      # 단일 사용자 — 배치 대기(ingress cohort 20ms)를 안 넣는다. serve 는 기본이 ON 이다
      - --asr.batching.enabled=false
      # 캐시-어웨어 RNNT 우측 문맥(스트리밍 경로용, 1=160ms). HTTP 파일 경로는 offline 모드라 영향 없다
      - --asr.streaming.rnnt_right_context
      - "1"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    # /ready 가 {"ready":true} 를 줄 때만 건강. 모델 로드 중엔 false 라 whisper 가 그 동안 기다린다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18101/ready | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  whisper_model_cache:
