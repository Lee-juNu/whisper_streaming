services:
  whisper:
    build: .
    container_name: npc_whisper
    restart: unless-stopped
    ports:
      - "${WHISPER_PORT:-8100}:8100"
    environment:
      WHISPER_HOST: 0.0.0.0
      WHISPER_PORT: 8100
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v2}
      WHISPER_BACKEND: ${WHISPER_BACKEND:-faster-whisper}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANG: ${WHISPER_LANG:-ko}
      WHISPER_LOG_LEVEL: ${WHISPER_LOG_LEVEL:-INFO}
      WHISPER_SILENCE_FLUSH_SEC: ${WHISPER_SILENCE_FLUSH_SEC:-1.5}
      WHISPER_MAX_BUFFER_SEC: ${WHISPER_MAX_BUFFER_SEC:-10.0}
      WHISPER_MIN_CHARS: ${WHISPER_MIN_CHARS:-1}
      # segment = 발화 단위로 한 번에 전사(기본). stream = 기존 LocalAgreement 스트리밍(롤백용)
      WHISPER_MODE: ${WHISPER_MODE:-segment}
      WHISPER_MAX_UTTERANCE_SEC: ${WHISPER_MAX_UTTERANCE_SEC:-20.0}
      WHISPER_MIN_UTTERANCE_SEC: ${WHISPER_MIN_UTTERANCE_SEC:-0.4}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
    volumes:
      - whisper_model_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  whisper_model_cache:
