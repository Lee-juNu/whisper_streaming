services:
  whisper:
    build: .
    container_name: npc_whisper
    restart: unless-stopped
    ports:
      - "${WHISPER_PORT:-8100}:8100"
    environment:
      WHISPER_HOST: 0.0.0.0
      WHISPER_PORT: 8100
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v2}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANG: ${WHISPER_LANG:-ko}
      WHISPER_LOG_LEVEL: ${WHISPER_LOG_LEVEL:-INFO}
      WHISPER_SILENCE_FLUSH_SEC: ${WHISPER_SILENCE_FLUSH_SEC:-1.5}
      WHISPER_MAX_BUFFER_SEC: ${WHISPER_MAX_BUFFER_SEC:-10.0}
      WHISPER_MIN_CHARS: ${WHISPER_MIN_CHARS:-1}
      # segment = 발화 단위로 한 번에 전사(기본). stream = 기존 LocalAgreement 스트리밍(롤백용)
      WHISPER_MODE: ${WHISPER_MODE:-segment}
      WHISPER_MAX_UTTERANCE_SEC: ${WHISPER_MAX_UTTERANCE_SEC:-20.0}
      WHISPER_MIN_UTTERANCE_SEC: ${WHISPER_MIN_UTTERANCE_SEC:-0.4}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      # 빠른 발화 확정(npc_panopticon/docs/early_endpoint_plan.md). 켜는 순서 = 판옵티콘 P2 → SIGNALS → EARLY.
      # SIGNALS=1 이면 확정 앞뒤로 speech_start/speech_end 를 보낸다. EARLY 는 비우면 SILENCE_FLUSH 그대로
      WHISPER_SPEECH_SIGNALS: ${WHISPER_SPEECH_SIGNALS:-0}
      WHISPER_EARLY_FLUSH_SEC: ${WHISPER_EARLY_FLUSH_SEC:-}
      WHISPER_PAUSE_LOG_MIN_SEC: ${WHISPER_PAUSE_LOG_MIN_SEC:-0.2}
      # 백엔드. faster-whisper(기본) | nemotron(발화를 아래 nemo 서비스로 보낸다, whisper 모델은 안 올린다)
      WHISPER_BACKEND: ${WHISPER_BACKEND:-faster-whisper}
      # nemotron 전용. compose 망 안의 nemo 서비스 주소와 언어 로캘(비우면 WHISPER_LANG 에서 변환)
      NEMO_URL: ${NEMO_URL:-http://nemo:18101}
      NEMO_LANGUAGE: ${NEMO_LANGUAGE:-}
    volumes:
      - whisper_model_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Nemotron ASR 서버(NVIDIA NeMo-Speech.cpp v0.1.0). WHISPER_BACKEND=nemotron 일 때만 띄운다 —
  # 스위치는 .env 의 COMPOSE_PROFILES=nemotron 이다. 3070 8GB 에는 모델 하나만 올리므로
  # whisper 쪽이 nemotron 백엔드일 때는 whisper 모델을 로드하지 않는다(NemotronASR).
  # 바이너리·GGUF 는 comparison/local 의 벤치 설치본을 **디렉토리째** 읽기 전용으로 마운트한다
  # (파일 하나짜리 바인드는 재부팅 레이스로 exit 127 이 난다 — syrinx·go2rtc 전례).
  # 베이스가 ubuntu 인 이유: 번들이 libcudart·libcublas 를 동봉하고, libcuda 는 nvidia 런타임이
  # 드라이버에서 넣어 준다(NVIDIA_DRIVER_CAPABILITIES). CUDA 이미지를 끌어올 필요가 없다.
  # 되돌릴 때: docker compose --profile "*" down  (프로파일 밖에서는 up -d 가 이 컨테이너를 안 내린다)
  nemo:
    image: ubuntu:22.04
    container_name: npc_nemo
    profiles: ["nemotron"]
    restart: unless-stopped
    command:
      - /opt/nemo/bin/nemo-speech
      - serve
      - --asr.model.path
      - /models/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf
      - --device
      - cuda:0
      - --host
      - 0.0.0.0
      - --port
      - "18101"
      - --no-ui
      # 단일 사용자 — 배치 대기(ingress cohort 20ms)를 안 넣는다. serve 는 기본이 ON 이다
      - --asr.batching.enabled=false
      # 캐시-어웨어 RNNT 우측 문맥(스트리밍 경로용, 1=160ms). HTTP 파일 경로는 offline 모드라 영향 없다
      - --asr.streaming.rnnt_right_context
      - "1"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./comparison/local/nemo-runtime/nemo-speech-0.1.0-linux-x86_64-cuda:/opt/nemo:ro
      - ./comparison/local/models/nemotron:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  whisper_model_cache:
